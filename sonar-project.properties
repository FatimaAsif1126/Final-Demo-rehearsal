# -----------------------------------------------------------------------------
# SonarQube / SonarCloud Configuration for Pure Java Project
# -----------------------------------------------------------------------------

# Unique identification for your project in SonarQube / SonarCloud
sonar.projectKey=SonarQubeCloudSQETest_java-sonar-lab
sonar.projectName=SQEJavaTest
sonar.projectVersion=1.0

# Source directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Compiled class paths (Required for Java static analysis)
sonar.java.binaries=out/classes
sonar.java.test.binaries=out/test-classes

# JaCoCo Coverage Report location (generated during test phase)
sonar.coverage.jacoco.xmlReportPaths=out/reports/jacoco/jacoco.xml

# Source code encoding
sonar.sourceEncoding=UTF-8

# SonarCloud organization and host URL
sonar.organization=sonarqubecloudsqetest
sonar.host.url=https://sonarcloud.io

# If using self-hosted SonarQube, set your host URL (or configure via GitHub Actions secret SONAR_HOST_URL):
# sonar.host.url=https://your-sonarqube-server.com
