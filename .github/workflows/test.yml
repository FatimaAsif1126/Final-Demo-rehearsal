name: Run Tests & Generate Coverage

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Shallow clones disabled for better Sonar analysis

      - name: Set up Java JDK
        uses: actions/setup-java@8df1039502a140fb607b34f63777f576bac34953 # v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Testing & Coverage Tools
        id: cache-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: lib
          key: pure-java-testing-tools-v1

      - name: Download JUnit & JaCoCo Standalone Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p lib
          echo "Downloading JUnit 5 Console Standalone..."
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfLo lib/junit-platform-console-standalone.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          
          echo "Downloading JaCoCo CLI and Agent..."
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfLo jacoco.zip https://repo1.maven.org/maven2/org/jacoco/jacoco/0.8.12/jacoco-0.8.12.zip
          unzip -q jacoco.zip -d jacoco-temp
          cp jacoco-temp/lib/jacocoagent.jar lib/
          cp jacoco-temp/lib/jacococli.jar lib/
          rm -rf jacoco.zip jacoco-temp
          echo "Testing tools downloaded successfully."

      - name: Compile Main Sources
        run: |
          mkdir -p out/classes
          javac --release 17 -d out/classes $(find src/main/java -name "*.java")

      - name: Compile Test Sources
        run: |
          mkdir -p out/test-classes
          javac --release 17 -cp "out/classes:lib/*" -d out/test-classes $(find src/test/java -name "*.java")

      - name: Run Unit Tests with JaCoCo Coverage Agent
        run: |
          mkdir -p out/reports/junit out/reports/jacoco
          java -javaagent:lib/jacocoagent.jar=destfile=out/reports/jacoco.exec,includes=com.example.sqe.* \
            -jar lib/junit-platform-console-standalone.jar \
            execute \
            --class-path out/classes \
            --class-path out/test-classes \
            --scan-class-path \
            --reports-dir=out/reports/junit

      - name: Generate JaCoCo XML & HTML Coverage Reports
        run: |
          java -jar lib/jacococli.jar report out/reports/jacoco.exec \
            --classfiles out/classes \
            --sourcefiles src/main/java \
            --xml out/reports/jacoco/jacoco.xml \
            --html out/reports/jacoco/html
          echo "JaCoCo Coverage report generated at out/reports/jacoco/jacoco.xml"

      - name: Upload JaCoCo Coverage Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: jacoco-coverage-report
          path: out/
          if-no-files-found: warn
